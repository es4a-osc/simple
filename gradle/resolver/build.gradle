/*
Simple 编译器专用的依赖解析工程，生成物统一写入应用构建目录。
仅解析原生模块声明并返回制品路径，不编译 Java、资源或 APK。
xhwsd@qq.com 2026-10-27
*/
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import simple.compiler.util.MavenRepository
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

buildscript {
	def sdk = file(providers.gradleProperty('sdkDir').get())
	def compiler = providers.gradleProperty('compilerPath').map { file(it) }.getOrElse(new File(sdk, 'simple/SimpleCompiler.jar'))
	def libraries = providers.gradleProperty('librariesDir').map { file(it) }.getOrElse(new File(sdk, 'simple/libs'))
	dependencies {
		classpath files(compiler, fileTree(libraries) { include '*.jar' })
	}
}

apply plugin: 'com.android.library'

def request = new JsonSlurper().parse(file(providers.gradleProperty('request').get()))
def work = file(request.work)
layout.buildDirectory = new File(work, 'gradle')
def manifest = new File(work, 'AndroidManifest.xml')
manifest.parentFile.mkdirs()
if (!manifest.isFile()) {
	manifest.setText('<manifest />\r\n', 'UTF-8')
}

android {
	namespace = 'simple.compiler.gradle'
	compileSdk = 30
	buildToolsVersion = '36.1.0'
	defaultConfig {
		minSdk = 24
	}
	sourceSets.main.manifest.srcFile manifest
}

// 本轮根库声明只暂存到应用的本地仓库，不向远端查询 ES4A 内部模块。
def roots = []
request.modules.each { item ->
	def source = file(item.file)
	def metadata = new JsonSlurper().parse(source)
	def component = metadata.component
	if (component.group != 'es4a.extension' || component.module != item.namespace ||
		!(component.module ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/) ||
		!(component.version ==~ /[A-Za-z0-9][A-Za-z0-9._+\-]*/)) {
		throw new GradleException("扩展库模块身份不匹配：${source}")
	}

	// 本库的二进制由编译器从交付目录读取，发布元数据只能提供依赖和约束。
	if (metadata.variants.any { it.files || it['available-at'] }) {
		throw new GradleException("扩展库依赖元数据不能携带制品或转发地址：${source}")
	}
	def target = new File(work, "repository/es4a/extension/${component.module}/${component.version}/${component.module}-${component.version}.module")
	target.parentFile.mkdirs()
	if (!target.isFile() || !Arrays.equals(source.bytes, target.bytes)) {
		target.bytes = source.bytes
	}
	roots.add("${component.group}:${component.module}:${component.version}")
}

// 同版本类库在本机重新发布后，必须重新读取其小型声明；线上固定版本仍复用正常缓存。
dependencies {
	roots.each { coordinate ->
		implementation(coordinate) {
			changing = true
		}
	}
}
configurations.configureEach {
	resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

tasks.register('resolveApplicationDependencies') {
	group = 'build'
	description = '统一解析项目实际引用的扩展库依赖，并输出原始制品路径。'
	doLast {
		// 消费 Android 运行变体，保留原始 JAR/AAR，不输出 AGP 转换后的编译占位包。
		def configuration = configurations.debugRuntimeClasspath
		// 模块图与制品来自同一次解析，拒绝将旧 Support 依赖带入统一 AndroidX 的应用。
		def components = configuration.incoming.resolutionResult.allComponents
		def unresolved = components.collectMany { it.dependencies.findAll { it instanceof UnresolvedDependencyResult } }
		if (unresolved) {
			throw new GradleException('扩展库依赖图无法解析。', unresolved.first().failure)
		}
		def legacy = components.findAll { it.id instanceof ModuleComponentIdentifier && it.id.group == 'com.android.support' }
		if (legacy) {
			throw new GradleException("应用统一采用 AndroidX，存在旧 Support 依赖：${legacy*.id}")
		}
		def graph = components.collect { component ->
			[id: component.id.displayName, dependencies: component.dependencies.findAll {
				it instanceof ResolvedDependencyResult
			}.collect { it.selected.id.displayName }]
		}

		// Gradle 不会跨仓库补齐已选模块的原包。只在主图选版完成后下载缺项，不另建选版算法。
		def artifacts = []
		def missing = []
		configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
			try {
				// 原包延迟读取；逐项记录失败，不能因同模块已有另一个包而遗漏缺项。
				artifact.file
				artifacts.add(artifact)
			} catch (GradleException failure) {
				if (gradle.startParameter.offline) {
					throw failure
				}
				missing.add([artifact: artifact, failure: failure])
			}
		}
		missing.groupBy { it.artifact.moduleVersion.id.toString() }.each { coordinate, entries ->
			def download = configurations.detachedConfiguration(dependencies.create(coordinate))
			download.transitive = false
			configuration.attributes.keySet().each { key ->
				download.attributes.attribute(key, configuration.attributes.getAttribute(key))
			}
			def candidates = download.resolvedConfiguration.resolvedArtifacts
			entries.each { entry ->
				def replacement = candidates.find { candidate ->
					candidate.moduleVersion.id.toString() == coordinate && candidate.name == entry.artifact.name &&
						candidate.classifier == entry.artifact.classifier && candidate.extension == entry.artifact.extension
				}
				if (replacement == null) {
					throw entry.failure
				}
				replacement.file
				artifacts.add(replacement)
			}
		}

		// 原始元数据由 Gradle 获取；不自行猜测个人缓存布局或直接发起 HTTP 请求。
		def metadataFiles = [:]
		def metadataSource = { String coordinate, String extension ->
			def key = "${coordinate}@${extension}".toString()
			if (!metadataFiles.containsKey(key)) {
				def id = coordinate.split(':')
				File metadataFile = new File(MavenRepository.directory(new File(work, 'repository'), coordinate), "${id[1]}-${id[2]}.${extension}")
				if (!metadataFile.isFile()) {
					metadataFile = null
				}
				if (metadataFile == null && extension == 'pom') {
					def result = dependencies.createArtifactResolutionQuery().forModule(id[0], id[1], id[2])
						.withArtifacts(MavenModule, MavenPomArtifact).execute()
					result.resolvedComponents.each { component ->
						component.getArtifacts(MavenPomArtifact).each { artifact ->
							if (artifact instanceof ResolvedArtifactResult) {
								metadataFile = artifact.file
							}
						}
					}
				} else if (metadataFile == null) {
					def query = configurations.detachedConfiguration(dependencies.create(key))
					query.transitive = false
					def candidates = query.resolvedConfiguration.lenientConfiguration.files
					metadataFile = candidates ? candidates.first() : null
				}
				metadataFiles[key] = metadataFile
			}
			metadataFiles[key]
		} as MavenRepository.MetadataSource
		def selected = components.findAll {
			it.id instanceof ModuleComponentIdentifier && it.id.group != 'es4a.extension'
		}.collect { "${it.id.group}:${it.id.module}:${it.id.version}".toString() }
		def originals = artifacts.collect { artifact ->
			def input = artifact.file
			if (!(artifact.extension.toLowerCase(Locale.ROOT) in ['jar', 'aar'])) {
				throw new GradleException("应用运行制品必须为 JAR/AAR：${artifact.moduleVersion.id} / ${input}")
			}
			new MavenRepository.Artifact(artifact.moduleVersion.id.toString(), input)
		}
		def repository = file(request.repository)
		MavenRepository.export(repository, originals, selected, metadataSource)
		def entries = artifacts.collect { artifact ->
			def input = new File(MavenRepository.directory(repository, artifact.moduleVersion.id.toString()), artifact.file.name)
			def digest = MessageDigest.getInstance('SHA-256')
			input.withInputStream { stream ->
				byte[] buffer = new byte[8192]
				for (int length; (length = stream.read(buffer)) != -1;) {
					digest.update(buffer, 0, length)
				}
			}
			[id: artifact.moduleVersion.id.toString(), classifier: artifact.classifier ?: '', file: input.canonicalPath,
				digest: digest.digest().encodeHex().toString()]
		}.sort { left, right -> left.id <=> right.id ?: left.file <=> right.file }

		// 只有完整解析成功后才替换结果文件，失败不会覆盖上一次有效快照。
		def result = [fingerprint: request.fingerprint, dependencies: entries, graph: graph]
		def output = file(request.output)
		def pending = new File(output.parentFile, output.name + '.pending')
		pending.setText(JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\r\n', 'UTF-8')
		Files.move(pending.toPath(), output.toPath(), StandardCopyOption.REPLACE_EXISTING)
	}
}
