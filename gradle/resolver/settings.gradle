/*
Simple 编译器的 Gradle 工程设置，所有生成文件位于应用构建目录。
xhwsd@qq.com 2026-10-27
*/
import groovy.json.JsonSlurper

rootProject.name = 'simple-compiler'
def request = new JsonSlurper().parse(file(providers.gradleProperty('request').get()))

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		// 扩展库元数据只从本轮生成的本地仓库读取，不向线上查询其内部身份。
		exclusiveContent {
			forRepository {
				maven {
					url = uri(new File(request.work, 'repository'))
					metadataSources {
						gradleMetadata()
					}
				}
			}
			filter {
				includeGroup 'es4a.extension'
			}
		}
		// 编译器已将随库与应用侧仓库合并；仅元数据声明参与选版，不按 JAR 文件名推断模块。
		maven {
			url = uri(new File(request.work, 'repository'))
			metadataSources {
				gradleMetadata()
				mavenPom()
			}
			content {
				excludeGroup 'es4a.extension'
				// 主图统一选版；缺失原包的独立下载配置只使用远程仓库及 Gradle 缓存。
				onlyForConfigurations 'debugRuntimeClasspath'
			}
		}
		google()
		mavenCentral()
		maven { url = uri('https://jitpack.io/') }
	}
}
