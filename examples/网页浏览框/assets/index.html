<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>网页交互离线示例</title>
	<style>
		body { margin: 12px; font: 16px sans-serif; color: #18202a; }
		button, input, a { margin: 5px 0; min-height: 38px; font: inherit; }
		button { display: block; width: 100%; }
		a { display: inline-block; padding-right: 16px; }
		iframe { width: 100%; height: 70px; border: 1px solid #ccc; }
		#result { white-space: pre-wrap; }
	</style>
</head>
<body>
	<label>用户名 <input id="username" value="张三"></label>
	<button id="send" onclick="register_js.call(JSON.stringify({username:document.getElementById('username').value}))">网页发送消息</button>
	<a id="allow" href="second.html">打开第二页</a>
	<a id="blocked" href="https://example.invalid/blocked">测试拦截链接</a>
	<button id="alert" onclick="alert('警告演示');document.getElementById('result').textContent='警告已返回'">警告框</button>
	<button id="confirm" onclick="document.getElementById('result').textContent=String(confirm('确认演示'))">确认框</button>
	<button id="prompt" onclick="document.getElementById('result').textContent=String(prompt('输入演示','默认内容'))">输入框</button>
	<p id="result">等待交互。</p>
	<iframe title="子资源失败验证" src="child.html"></iframe>
	<script>
		function setUserName(value) {
			document.getElementById("username").value = value;
		}
		function sum2Java(first, second) {
			return first + second;
		}
	</script>
</body>
</html>
